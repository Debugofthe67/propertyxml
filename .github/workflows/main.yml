name: Build PropertyXML

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: propertyxml-windows-x64.exe
            output_name: propertyxml.exe
          - os: macos-latest
            artifact_name: propertyxml-macos-universal
            output_name: propertyxml
          - os: ubuntu-latest
            artifact_name: propertyxml-linux-x64
            output_name: propertyxml

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller Spec
        run: |
          pyinstaller propertyxml.spec

      - name: Rename Executable for Artifacts
        shell: bash
        run: |
          mkdir -p release_artifacts
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv dist/propertyxml.exe release_artifacts/${{ matrix.artifact_name }}
          else
            mv dist/propertyxml release_artifacts/${{ matrix.artifact_name }}
          fi

      - name: Upload Portable Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release_artifacts/${{ matrix.artifact_name }}
